<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
  <title>Snippd — Extensions</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("snippd-theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans"', "system-ui", "sans-serif"],
            mono: ['"IBM Plex Mono"', "ui-monospace", "monospace"],
          },
          colors: {
            ink: { DEFAULT: "var(--ink)", muted: "var(--ink-muted)", faint: "var(--ink-faint)" },
            paper: { DEFAULT: "var(--paper)", card: "var(--paper-card)", line: "var(--paper-line)" },
            accent: { DEFAULT: "var(--accent)", soft: "var(--accent-soft)" },
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="min-h-screen bg-paper text-ink font-sans antialiased">
  <div class="flex min-h-screen">
    <aside class="w-52 shrink-0 border-r border-paper-line bg-paper px-4 py-6 flex flex-col gap-8">
      <div>
        <a href="index.html" class="block text-lg font-semibold tracking-tight">Snippd</a>
        <p class="mt-0.5 text-xs text-ink-faint">Local snippet manager</p>
      </div>
      <nav class="flex flex-col gap-1 text-sm">
        <a href="index.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">All snippets</a>
        <a href="search.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Search</a>
        <a href="new.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">New snippet</a>
        <a href="recent.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Recent</a>
        <a href="extensions.html" class="rounded-md bg-paper-card px-3 py-2 font-medium text-ink shadow-sm ring-1 ring-paper-line">Extensions</a>
        <div class="my-2 border-t border-paper-line"></div>
        <a href="config.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Config</a>
        <a href="doctor.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Doctor</a>
      </nav>
      <div class="mt-auto space-y-3">
        <button type="button" data-theme-toggle class="w-full rounded-md border border-paper-line bg-paper-card px-3 py-2 text-left text-sm text-ink-muted hover:text-ink">
          Theme · <span data-theme-label>Dark</span>
        </button>
      </div>
    </aside>

    <main class="flex-1 px-8 py-6 max-w-5xl">
      <header class="mb-6">
        <h1 class="text-xl font-semibold tracking-tight">Extensions</h1>
        <p class="text-sm text-ink-muted mt-1">Browse snippets grouped by file extension. <span class="font-mono text-xs text-ink-faint">exts</span></p>
      </header>

      <form
        id="ext-search"
        class="mb-5"
        hx-get="/api/snippets/extensions"
        hx-target="#ext-grid"
        hx-swap="innerHTML"
        hx-trigger="submit, input delay:200ms from:#ext-q"
      >
        <label class="sr-only" for="ext-q">Search extensions</label>
        <input
          id="ext-q"
          name="q"
          type="search"
          placeholder="Search extensions… e.g. ts, html, py"
          autocomplete="off"
          class="w-full max-w-md rounded-md border border-paper-line bg-paper-card px-4 py-2.5 font-mono text-sm placeholder:text-ink-faint focus:outline-none focus:ring-2 focus:ring-accent/30"
        />
      </form>

      <div
        id="ext-grid"
        class="mb-8 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"
        hx-get="/api/snippets/extensions"
        hx-trigger="load"
        hx-swap="innerHTML"
      >
        <p class="col-span-full text-sm text-ink-faint">Loading…</p>
      </div>

      <section id="ext-snippets">
        <p class="text-sm text-ink-faint">Select an extension to list its snippets.</p>
      </section>
    </main>
  </div>
  <script src="assets/theme.js"></script>
  <script>
    (function () {
      const ext = new URLSearchParams(window.location.search).get("ext");
      const panel = document.getElementById("ext-snippets");
      if (!ext || !panel) return;
      panel.setAttribute("hx-get", "/api/snippets/extensions/" + encodeURIComponent(ext));
      panel.setAttribute("hx-trigger", "load");
      panel.setAttribute("hx-swap", "innerHTML");
      if (window.htmx) htmx.process(panel);
    })();
  </script>
</body>
</html>
