<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="/ui/assets/htmx.min.js"></script>
  <title>Snippd — Search</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("snippd-theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/ui/assets/output.css" />
  <link rel="stylesheet" href="/ui/assets/theme.css" />
</head>
<body class="min-h-screen bg-paper text-ink font-sans antialiased">
  <div class="flex min-h-screen">
    <aside class="w-52 shrink-0 border-r border-paper-line bg-paper px-4 py-6 flex flex-col gap-8">
      <div>
        <a href="index.html" class="block text-lg font-semibold tracking-tight">Snippd</a>
        <p class="mt-0.5 text-xs text-ink-faint">Local snippet manager</p>
      </div>
      <nav class="flex flex-col gap-1 text-sm">
        <a href="index.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">All snippets</a>
        <a href="search.html" class="rounded-md bg-paper-card px-3 py-2 font-medium text-ink shadow-sm ring-1 ring-paper-line">Search</a>
        <a href="new.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">New snippet</a>
        <a href="recent.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Recent</a>
        <a href="extensions.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Extensions</a>
        <a href="containers.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Containers</a>
        <a href="tags.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Tags</a>
        <a href="ai.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">AI Search</a>
        <div class="my-2 border-t border-paper-line"></div>
        <a href="backup.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Backup</a>
        <a href="config.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Config</a>
        <a href="doctor.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Doctor</a>
      </nav>
      <div class="mt-auto space-y-3">
        <button type="button" data-theme-toggle class="w-full rounded-md border border-paper-line bg-paper-card px-3 py-2 text-left text-sm text-ink-muted hover:text-ink">
          Theme · <span data-theme-label>Dark</span>
        </button>
      </div>
    </aside>

    <main class="flex-1 px-8 py-6 max-w-5xl">
      <header class="mb-6">
        <h1 class="text-xl font-semibold tracking-tight">Search</h1>
        <p class="text-sm text-ink-muted mt-1">Full-text search across titles, code, and extensions. <span class="font-mono text-xs text-ink-faint">search</span></p>
      </header>

      <form 
      class="mb-6"
      hx-post="/api/snippets/search"
      hx-swap="innerHTML"
      hx-target="#search-results"
      hx-trigger="submit"
      hx-indicator="#search-loader"
      id="search-form">
        <label class="sr-only" for="query">Query</label>
        <div class="flex gap-2 mb-3">
          <input id="query" name="query" type="search" placeholder="e.g. debounce, upsert, fetch…" autofocus class="flex-1 rounded-md border border-paper-line bg-paper-card px-4 py-2.5 text-sm placeholder:text-ink-faint focus:outline-none focus:ring-2 focus:ring-accent/30" />
          <button type="submit" class="rounded-md bg-ink px-4 py-2.5 text-sm font-medium text-paper hover:opacity-90">Search</button>
        </div>
        <div class="flex flex-wrap gap-4 text-xs text-ink-muted">
          <label class="flex items-center gap-2">
            <input type="checkbox" name="title" value="true" class="rounded border-paper-line bg-paper-card">
            Title
          </label>
          <label class="flex items-center gap-2">
            <input type="checkbox" name="content" value="true" class="rounded border-paper-line bg-paper-card">
            Content
          </label>
          <label class="flex items-center gap-2">
            <input type="checkbox" name="ext" value="true" class="rounded border-paper-line bg-paper-card">
            Extension
          </label>
          <label class="flex items-center gap-2">
            <input type="checkbox" name="tags" value="true" class="rounded border-paper-line bg-paper-card">
            Tags
          </label>
        </div>
      </form>

      <form
        id="search-select"
        data-bulk-delete
        class="space-y-3"
        hx-post="/api/snippets/delete"
        hx-target="#search-results"
        hx-swap="innerHTML"
        hx-include="this, #query"
        hx-on::before-request="if (!window.snippdConfirmBulkDelete(this)) event.preventDefault();"
      >
        <input type="hidden" name="view" value="search" />
        <div class="flex justify-end">
          <button
            type="submit"
            data-delete-selected
            disabled
            class="rounded-md border border-danger/20 bg-danger-soft px-3 py-2 text-sm font-medium text-danger hover:opacity-90 disabled:opacity-40"
          >
            <span data-delete-label>Delete selected</span>
          </button>
        </div>
        <div
          id="search-results"
          class="overflow-hidden rounded-lg border border-paper-line bg-paper-card">
          <div class="htmx-indicator loader" id="search-loader">Searching…</div>
          <div class="flex min-h-35 items-center justify-center p-6 text-center text-sm text-ink-faint">
            <span id="search-count" class="font-mono">No matches found.</span>
          </div>
        </div>
      </form>
    </main>
  </div>
  <script src="assets/theme.js"></script>
  <script>
    (function () {
      const queryInput = document.getElementById("query");
      const savedQuery = localStorage.getItem("snippd-search-query");
      if (savedQuery && queryInput) queryInput.value = savedQuery;
      
      if (queryInput) {
        queryInput.addEventListener("change", () => {
          localStorage.setItem("snippd-search-query", queryInput.value);
        });
      }
    })();
  </script>
</body>
</html>
