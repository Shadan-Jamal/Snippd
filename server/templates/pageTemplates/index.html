<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
  <title>Snippd — Snippets</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("snippd-theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans"', "system-ui", "sans-serif"],
            mono: ['"IBM Plex Mono"', "ui-monospace", "monospace"],
          },
          colors: {
            ink: { DEFAULT: "var(--ink)", muted: "var(--ink-muted)", faint: "var(--ink-faint)" },
            paper: { DEFAULT: "var(--paper)", card: "var(--paper-card)", line: "var(--paper-line)" },
            accent: { DEFAULT: "var(--accent)", soft: "var(--accent-soft)" },
            danger: { DEFAULT: "var(--danger)", soft: "var(--danger-soft)" },
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="min-h-screen bg-paper text-ink font-sans antialiased">
  <div class="flex min-h-screen">
    <aside class="w-52 shrink-0 border-r border-paper-line bg-paper px-4 py-6 flex flex-col gap-8">
      <div>
        <a href="index.html" class="block text-lg font-semibold tracking-tight">Snippd</a>
        <p class="mt-0.5 text-xs text-ink-faint">Local snippet manager</p>
      </div>
      <nav class="flex flex-col gap-1 text-sm">
        <a href="index.html" class="rounded-md bg-paper-card px-3 py-2 font-medium text-ink shadow-sm ring-1 ring-paper-line">All snippets</a>
        <a href="search.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Search</a>
        <a href="new.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">New snippet</a>
        <a href="recent.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Recent</a>
        <a href="extensions.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Extensions</a>
        <div class="my-2 border-t border-paper-line"></div>
        <a href="config.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Config</a>
        <a href="doctor.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Doctor</a>
      </nav>
      <div class="mt-auto space-y-3">
        <button type="button" data-theme-toggle class="w-full rounded-md border border-paper-line bg-paper-card px-3 py-2 text-left text-sm text-ink-muted hover:text-ink">
          Theme · <span data-theme-label>Dark</span>
        </button>
        <p class="text-xs text-ink-faint px-1">Wire APIs later · static preview</p>
      </div>
    </aside>

    <main class="flex-1 px-8 py-6 max-w-5xl">
      <header class="flex flex-wrap items-end justify-between gap-4 mb-6">
        <div>
          <h1 class="text-xl font-semibold tracking-tight">All snippets</h1>
          <p class="text-sm text-ink-muted mt-1">Browse, filter, and open snippets. <span class="font-mono text-xs text-ink-faint">list</span></p>
        </div>
        <a href="new.html" class="inline-flex items-center rounded-md bg-ink px-3.5 py-2 text-sm font-medium text-paper hover:opacity-90">
          New snippet
        </a>
      </header>

      <form
      hx-get="/api/snippets"
      hx-swap="innerHTML"
      hx-target="#snippets-table"
      hx-trigger="submit"
      hx-include="this, #list-limit"
      hx-vals='{"page": "1"}'
      class="mb-5 flex flex-wrap gap-3" 
      id="filters">
        <label class="flex flex-col gap-1 text-xs text-ink-muted">
          Extension
          <input type="text" name="ext" placeholder="ts, js, py" class="w-40 rounded-md border border-paper-line bg-paper-card px-3 py-2 text-sm text-ink placeholder:text-ink-faint focus:outline-none focus:ring-2 focus:ring-accent/30" />
        </label>
        <label class="flex flex-col gap-1 text-xs text-ink-muted">
          Tags
          <input type="text" name="tags" placeholder="react, api" class="w-48 rounded-md border border-paper-line bg-paper-card px-3 py-2 text-sm text-ink placeholder:text-ink-faint focus:outline-none focus:ring-2 focus:ring-accent/30" />
        </label>
        <div class="flex items-end gap-2">
          <button type="submit" class="rounded-md border border-paper-line bg-paper-card px-3 py-2 text-sm font-medium hover:opacity-90">Apply</button>
          <button 
          type="reset" 
          hx-on:click="
          this.form.reset();
          htmx.ajax('GET', '/api/snippets', { target: '#snippets-table', swap: 'innerHTML', values: { page: 1, limit: document.getElementById('list-limit').value } });
          "
          class="rounded-md px-3 py-2 text-sm text-ink-muted hover:text-ink">Clear</button>
        </div>
      </form>

      <form
        id="snippet-select"
        data-bulk-delete
        hx-post="/api/snippets/delete"
        hx-target="#snippets-table"
        hx-swap="innerHTML"
        hx-include="this, #filters, #list-limit, #list-page"
        hx-on::before-request="if (!window.snippdConfirmBulkDelete(this)) event.preventDefault();"
      >
        <input type="hidden" name="view" value="list" />
        <input type="hidden" id="list-page" name="page" value="1" />
        <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
          <label class="flex items-center gap-2 text-xs text-ink-muted">
            Per page
            <select
              id="list-limit"
              name="limit"
              hx-get="/api/snippets"
              hx-target="#snippets-table"
              hx-swap="innerHTML"
              hx-include="#filters"
              hx-vals='{"page": "1"}'
              hx-trigger="change"
              class="rounded-md border border-paper-line bg-paper-card px-2 py-1.5 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-accent/30"
            >
              <option value="10">10</option>
              <option value="25" selected>25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
          <button
            type="submit"
            data-delete-selected
            disabled
            class="rounded-md border border-danger/20 bg-danger-soft px-3 py-2 text-sm font-medium text-danger hover:opacity-90 disabled:opacity-40"
          >
            <span data-delete-label>Delete selected</span>
          </button>
        </div>
        <div
          id="snippets-table"
          class="overflow-hidden rounded-lg border border-paper-line bg-paper-card">
          <p class="px-4 py-8 text-sm text-ink-faint">Loading…</p>
        </div>
      </form>
      <div id="snippets-pager" class="mt-4"></div>
    </main>
  </div>
  <script src="assets/theme.js"></script>
  <script src="assets/select.js"></script>
  <script>
    (function () {
      const ext = new URLSearchParams(window.location.search).get("ext");
      const table = document.getElementById("snippets-table");
      const limit = document.getElementById("list-limit");
      const values = { page: 1, limit: limit ? limit.value : 25 };
      if (ext) {
        const input = document.querySelector("#filters [name=ext]");
        if (input) input.value = ext;
        values.ext = ext;
      }
      htmx.ajax("GET", "/api/snippets", {
        target: "#snippets-table",
        swap: "innerHTML",
        values: values,
      });

      document.body.addEventListener("htmx:afterSwap", function (event) {
        if (event.target && event.target.id === "snippets-table") {
          const pager = document.getElementById("snippets-pager");
          const pageInput = document.getElementById("list-page");
          if (pager && pageInput && pager.dataset.page) pageInput.value = pager.dataset.page;
        }
      });
    })();
  </script>
</body>
</html>
