<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="/ui/assets/htmx.min.js"></script>
  <title>Snippd — New snippet</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("snippd-theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/ui/assets/output.css" />
  <link rel="stylesheet" href="/ui/assets/theme.css" />
</head>
<body class="min-h-screen bg-paper text-ink font-sans antialiased">
  <div class="flex min-h-screen">
    <aside class="w-52 shrink-0 border-r border-paper-line bg-paper px-4 py-6 flex flex-col gap-8">
      <div>
        <a href="index.html" class="block text-lg font-semibold tracking-tight">Snippd</a>
        <p class="mt-0.5 text-xs text-ink-faint">Local snippet manager</p>
      </div>
      <nav class="flex flex-col gap-1 text-sm">
        <a href="index.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">All snippets</a>
        <a href="search.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Search</a>
        <a href="new.html" class="rounded-md bg-paper-card px-3 py-2 font-medium text-ink shadow-sm ring-1 ring-paper-line">New snippet</a>
        <a href="recent.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Recent</a>
        <a href="containers.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Extensions</a>
        <a href="containers.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Containers</a>
        <a href="tags.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Tags</a>
        <a href="ai.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">AI Search</a>
        <div class="my-2 border-t border-paper-line"></div>
        <a href="backup.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Backup</a>
        <a href="config.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Config</a>
        <a href="doctor.html" class="rounded-md px-3 py-2 text-ink-muted hover:bg-paper-card hover:text-ink">Doctor</a>
      </nav>
      <div class="mt-auto space-y-3">
        <button type="button" data-theme-toggle class="w-full rounded-md border border-paper-line bg-paper-card px-3 py-2 text-left text-sm text-ink-muted hover:text-ink">
          Theme · <span data-theme-label>Dark</span>
        </button>
      </div>
    </aside>

    <main class="flex-1 px-8 py-6 max-w-3xl">
      <header class="mb-6">
        <h1 class="text-xl font-semibold tracking-tight">New snippet</h1>
        <p class="text-sm text-ink-muted mt-1">Create a snippet with title, extension, tags, and body, or pick files from disk. <span class="font-mono text-xs text-ink-faint">save</span> <span class="font-mono text-xs text-ink-faint">--file</span></p>
      </header>

      <form 
      class="space-y-5" 
      id="save-form"
      hx-post="/api/snippets/new"
      hx-target="#save-form-response"
      hx-trigger="submit"
      hx-swap="innerHTML"
      hx-indicator="#save-loader"
      onsubmit="">
        <label class="block">
          <span class="text-xs font-medium text-ink-muted">From files <span class="text-ink-faint">(optional)</span></span>
          <input id="snippet-files" type="file" multiple class="mt-1.5 block w-full text-sm text-ink-muted file:mr-3 file:rounded-md file:border file:border-paper-line file:bg-paper file:px-3 file:py-1.5 file:text-sm file:font-medium file:text-ink hover:file:opacity-90" />
          <span class="mt-1 block text-xs text-ink-faint">One file fills the form. Several files save on submit, using each filename as the title. Up to <span class="font-medium" style="color: var(--warn)">200 files</span> and <span class="font-medium" style="color: var(--warn)">10mb</span> total.</span>
        </label>

        <label class="block">
          <span class="text-xs font-medium text-ink-muted">Title <span class="text-ink-faint">(unique)</span></span>
          <input name="title" required placeholder="debounce-hook" class="mt-1.5 w-full rounded-md border border-paper-line bg-paper-card px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/30" />
        </label>

        <div class="grid grid-cols-2 gap-4">
          <label class="block">
            <span class="text-xs font-medium text-ink-muted">Extension</span>
            <input name="extension" value="" placeholder="ts,js,c,etc. - txt by default" class="mt-1.5 w-full rounded-md border border-paper-line bg-paper-card px-3 py-2 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-accent/30" />
          </label>
          <label class="block">
            <span class="text-xs font-medium text-ink-muted">Tags</span>
            <input name="tags" placeholder="react,hooks" class="mt-1.5 w-full rounded-md border border-paper-line bg-paper-card px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/30" />
            <span class="mt-1 block text-xs text-ink-faint">Comma-separated</span>
          </label>
        </div>

        <label class="block">
          <span class="text-xs font-medium text-ink-muted">Code</span>
          <textarea name="code" required rows="14" placeholder="// paste or write your code…" class="mt-1.5 w-full rounded-md border border-paper-line bg-paper-card px-3 py-2.5 font-mono text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-accent/30"></textarea>
        </label>

        <div class="flex flex-col items-start gap-3 pt-1">
          <div id="save-form-response" hx-swap-oob="true" class="hidden"></div>
          <div class="flex items-center gap-3">
            <button 
            type="submit" 
            class="rounded-md bg-ink px-4 py-2 text-sm font-medium text-paper hover:opacity-90"
            hx-disable>Save snippet</button>
            <span id="save-loader" class="htmx-indicator">Saving…</span>
            <a href="index.html" class="text-sm text-ink-muted hover:text-ink"
            hx-disable>Cancel</a>
          </div>
        </div>
      </form>
    </main>
  </div>
  <script src="assets/theme.js"></script>
  <script>
    (function () {
      const form = document.getElementById("save-form");
      const fileInput = document.getElementById("snippet-files");
      const titleInput = form.querySelector("[name=title]");
      const extInput = form.querySelector("[name=extension]");
      const codeInput = form.querySelector("[name=code]");
      let picked = [];

      function splitName(filename) {
        const dot = filename.lastIndexOf(".");
        if (dot > 0 && dot < filename.length - 1) {
          return { title: filename.slice(0, dot), extension: filename.slice(dot + 1) };
        }
        return { title: filename, extension: "txt" };
      }

      fileInput.addEventListener("change", async function () {
        picked = Array.from(fileInput.files || []);
        const many = picked.length > 1;
        titleInput.required = !many;
        codeInput.required = !many;
        if (picked.length !== 1) return;
        const file = picked[0];
        const text = await file.text();
        const parts = splitName(file.name);
        if (!titleInput.value.trim()) titleInput.value = parts.title;
        if (!extInput.value.trim()) extInput.value = parts.extension;
        codeInput.value = text;
      });

      form.addEventListener("submit", async function (event) {
        if (picked.length <= 1) return;
        event.preventDefault();
        event.stopImmediatePropagation();

        const tags = form.querySelector("[name=tags]").value;
        const snippets = [];
        for (const file of picked) {
          const parts = splitName(file.name);
          snippets.push({
            title: parts.title,
            extension: parts.extension,
            code: await file.text(),
            tags: tags,
          });
        }

        const response = await fetch("/api/snippets/new", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "text/html" },
          body: JSON.stringify({ snippets: snippets }),
        });
        const html = await response.text();
        const slot = document.getElementById("save-form-response");
        slot.outerHTML = html;
      }, true);
    })();
  </script>
</body>
</html>
